apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: rag-app.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: java-backend
                port:
                  number: 9090
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: python-ai-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80