server {
    listen 80;
    server_name localhost;

    # Keep operational endpoints private; metrics are not exposed by the public gateway.\n    location = /actuator { return 404; }\n    location ^~ /actuator/ { return 404; }\n\n    # ---- Frontend (React static build via frontend container) ----
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Java Backend API (auth, proxy to Python) ----
    location /api/ {
        proxy_pass http://java-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # ---- Python AI Service (direct, if needed for dev/testing) ----
    location /ai/ {
        proxy_pass http://python-ai-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}