version: '3.8'

services:
  postgres:
    restart: always
    environment:
      POSTGRES_DB: rag_system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: []         

  redis:
    restart: always
    ports: []          

  python-ai-service:
    build:
      context: ../python-ai-service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  java-backend:
    build:
      context: ../java-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: admin
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rag_system
      JWT_SECRET: ${JWT_SECRET}
      PYTHON_SERVICE_URL: http://python-ai-service:8000
      PYTHON_SERVICE_API_KEY: ${INTERNAL_API_KEY}
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE: /api
    restart: always

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
      - "443:443"
    restart: always