name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # JAVA BACKEND - Sirf compile check (test nahi, abhi tests nahi hain)
  # ============================================================
  java-build:
    name: Java Backend - Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Java backend (tests skip)
        run: |
          cd java-backend
          mvn clean compile

  # ============================================================
  # PYTHON AI SERVICE - Sirf syntax check (abhi tests nahi)
  # ============================================================
  python-build:
    name: Python AI Service - Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd python-ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "requirements.txt not ready yet"

      - name: Basic syntax check
        run: |
          cd python-ai-service
          python -m py_compile app/*.py || echo "Some files not ready yet"