name: CI Pipeline
on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17", cache: maven}
      - run: mvn -B verify
        working-directory: java-backend
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ci-test-secret-key-at-least-32-bytes-long
          DB_PASSWORD: ci-password
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: python-ai-service/requirements.txt}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
        working-directory: python-ai-service
      - run: pytest -q
        working-directory: python-ai-service
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Prepare npm lockfile
        run: npm install --package-lock-only --ignore-scripts
        working-directory: frontend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-python-ai-service ./python-ai-service
      - run: docker build -t rag-java-backend ./java-backend
      - run: docker build -t rag-frontend --build-arg VITE_API_BASE=/api ./frontend
