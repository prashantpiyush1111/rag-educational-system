name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  java-build:
    name: Java Backend - Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java backend (skip if not ready)
        run: |
          if [ -f java-backend/pom.xml ]; then
            cd java-backend
            mvn clean compile
          else
            echo "pom.xml not found yet, skipping build"
          fi

  python-build:
    name: Python AI Service - Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (skip if not ready)
        run: |
          if [ -f python-ai-service/requirements.txt ]; then
            cd python-ai-service
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            echo "requirements.txt not found yet, skipping"
          fi