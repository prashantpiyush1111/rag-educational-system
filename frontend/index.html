<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Educational Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; padding: 40px 20px; }
  .container { width: 100%; max-width: 800px; }
  h1 { margin-bottom: 20px; font-size: 24px; color: #38bdf8; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .upload-row { display: flex; gap: 10px; align-items: center; }
  input[type="file"] { flex: 1; color: #e2e8f0; }
  button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  button:hover { background: #0ea5e9; }
  button:disabled { background: #475569; cursor: not-allowed; }
  #uploadStatus { margin-top: 10px; font-size: 14px; color: #94a3b8; }
  .chat-box { height: 400px; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
  .msg { margin-bottom: 15px; }
  .msg .role { font-size: 12px; color: #64748b; margin-bottom: 4px; }
  .msg .text { background: #334155; padding: 10px 14px; border-radius: 8px; display: inline-block; max-width: 90%; white-space: pre-wrap; }
  .msg.user .text { background: #38bdf8; color: #0f172a; }
  .sources { font-size: 12px; color: #64748b; margin-top: 5px; }
  .input-row { display: flex; gap: 10px; }
  .input-row input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #0f172a; color: #e2e8f0; }
  .input-row input:focus { outline: 1px solid #38bdf8; }
</style>
</head>
<body>
<div class="container">
  <h1>📚 RAG Educational Assistant</h1>

  <div class="card">
    <div class="upload-row">
      <input type="file" id="fileInput" accept=".pdf,.txt,.docx">
      <button id="uploadBtn">Upload</button>
    </div>
    <div id="uploadStatus"></div>
  </div>

  <div class="card">
    <div class="chat-box" id="chatBox"></div>
    <div class="input-row">
      <input type="text" id="questionInput" placeholder="Ask a question about your documents...">
      <button id="askBtn">Ask</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000";

const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const uploadStatus = document.getElementById("uploadStatus");
const chatBox = document.getElementById("chatBox");
const questionInput = document.getElementById("questionInput");
const askBtn = document.getElementById("askBtn");

uploadBtn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) {
    uploadStatus.textContent = "Please select a file first.";
    return;
  }

  uploadBtn.disabled = true;
  uploadStatus.textContent = "Uploading and processing...";

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch(`${API_BASE}/documents/upload`, {
      method: "POST",
      body: formData
    });
    const data = await res.json();

    if (res.ok) {
      uploadStatus.textContent = `✅ ${data.filename} uploaded — ${data.chunks_created} chunks created.`;
    } else {
      uploadStatus.textContent = `❌ Error: ${data.detail || "Upload failed"}`;
    }
  } catch (err) {
    uploadStatus.textContent = `❌ Could not connect to server. Is it running?`;
  } finally {
    uploadBtn.disabled = false;
  }
});

function addMessage(role, text, sources) {
  const msgDiv = document.createElement("div");
  msgDiv.className = `msg ${role}`;

  const roleLabel = document.createElement("div");
  roleLabel.className = "role";
  roleLabel.textContent = role === "user" ? "You" : "Assistant";

  const textDiv = document.createElement("div");
  textDiv.className = "text";
  textDiv.textContent = text;

  msgDiv.appendChild(roleLabel);
  msgDiv.appendChild(textDiv);

  if (sources && sources.length > 0) {
    const sourcesDiv = document.createElement("div");
    sourcesDiv.className = "sources";
    sourcesDiv.textContent = "Sources: " + [...new Set(sources)].join(", ");
    msgDiv.appendChild(sourcesDiv);
  }

  chatBox.appendChild(msgDiv);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function askQuestion() {
  const question = questionInput.value.trim();
  if (!question) return;

  addMessage("user", question);
  questionInput.value = "";
  askBtn.disabled = true;

  try {
    const res = await fetch(`${API_BASE}/query/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, top_k: 4 })
    });
    const data = await res.json();

    if (res.ok) {
      addMessage("assistant", data.answer, data.sources);
    } else {
      addMessage("assistant", `Error: ${data.detail || "Something went wrong"}`);
    }
  } catch (err) {
    addMessage("assistant", "Could not connect to server. Is it running?");
  } finally {
    askBtn.disabled = false;
  }
}

askBtn.addEventListener("click", askQuestion);
questionInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") askQuestion();
});
</script>
</body>
</html>
