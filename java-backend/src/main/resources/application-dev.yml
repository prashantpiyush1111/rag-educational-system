server:
  port: 9090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rag_system
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.education.rag: DEBUG
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-to-a-long-random-secret}
  python-service:
    api-key: ${INTERNAL_API_KEY:local-dev-only-internal-key}
