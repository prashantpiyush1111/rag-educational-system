server:
  port: 9090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rag_system
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.education.rag: DEBUG