spring:
  datasource:
    url: jdbc:h2:mem:ragtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false
app:
  jwt:
    secret: test-secret-key-must-be-at-least-32-bytes-long
    expiration-ms: 3600000
  python-service:
    base-url: http://localhost:8000
    api-key: test-only-key
